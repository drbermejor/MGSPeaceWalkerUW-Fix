name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DPWUWFIX_RELEASE=${{ github.ref_name }}"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Installer smoke test
        shell: pwsh
        run: ./tests/windows_package_smoke.ps1 -Dll ./build/bin/winmm.dll -Launcher ./build/bin/launcher.exe -LauncherProbe ./build/bin/pw_launcher_args_probe.exe
      - run: python scripts/package_release.py --dll build/bin/winmm.dll --launcher build/bin/launcher.exe
      - name: Release package tests
        run: python tests/release_package_test.py --dist dist --dll build/bin/winmm.dll
      - name: Scan final Windows release with Microsoft Defender
        shell: pwsh
        run: |
          $guidedPackage = Get-Item ./dist/*-windows.zip
          $packages = Get-Item ./dist/*-windows*.zip
          $expanded = Join-Path $env:RUNNER_TEMP 'release-windows'
          Expand-Archive -LiteralPath $guidedPackage.FullName -DestinationPath $expanded
          ./scripts/defender_scan.ps1 `
            -Dll (Join-Path $expanded 'bin/winmm.dll') `
            -Launcher (Join-Path $expanded 'bin/launcher.exe') `
            -Package $packages.FullName
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: Publish as Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Peace Walker UltraWide Fix ${GITHUB_REF_NAME} — Public candidate" \
              --notes-file "$notes" --latest
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "Peace Walker UltraWide Fix ${GITHUB_REF_NAME} — Public candidate" \
              --notes-file "$notes" --latest
          fi
